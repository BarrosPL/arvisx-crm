<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ArvisX CRM — proposta de design novo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Geist:wght@400;500;600;700&display=swap">
<style>
  :root { --tela: #14161a; --painel: #1c1f25; --linha: #2b2f37; --texto: #eceef1; --apoio: #9aa1ad; --fraco: #6a717d; --marca: #d4af37; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font: 14px/1.45 "Geist", "Segoe UI", Arial, sans-serif; background: var(--tela); color: var(--texto); display: grid; grid-template-columns: 272px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--marca); outline-offset: 2px; border-radius: 8px; }

  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; padding: 12px 18px; border-bottom: 1px solid var(--linha); }
  header h1 { font: 640 17px/1.1 "Bricolage Grotesque", sans-serif; letter-spacing: -.03em; margin-right: auto; }
  header h1 small { display: block; margin-top: 4px; font: 400 12.5px/1.3 "Geist", sans-serif; letter-spacing: 0; color: var(--apoio); }
  .grupo-botoes { display: inline-flex; padding: 4px; gap: 2px; border-radius: 999px; background: var(--painel); }
  .grupo-botoes button { padding: 8px 14px; border-radius: 999px; font-weight: 600; font-size: 13px; color: var(--apoio); white-space: nowrap; }
  .grupo-botoes button:hover { color: var(--texto); }
  .grupo-botoes button[aria-pressed="true"] { background: var(--texto); color: #101216; }
  .grupo-botoes .amostra { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 7px; vertical-align: -1px; box-shadow: 0 0 0 1.5px rgba(255,255,255,.25); }

  nav { overflow-y: auto; padding: 12px 10px 24px; border-right: 1px solid var(--linha); scrollbar-width: thin; scrollbar-color: var(--linha) transparent; }
  nav h2 { padding: 12px 10px 6px; font: 600 11.5px/1 "Geist", sans-serif; color: var(--fraco); }
  nav button { display: flex; width: 100%; align-items: baseline; justify-content: space-between; gap: 8px; padding: 7px 10px; border-radius: 9px; text-align: left; color: var(--apoio); }
  nav button:hover { background: var(--painel); color: var(--texto); }
  nav button[aria-current="true"] { background: var(--painel); color: var(--texto); box-shadow: inset 2px 0 0 var(--marca); }
  nav button small { font: 400 11px/1 "Geist", sans-serif; color: var(--fraco); }

  main { min-width: 0; min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); }
  .legenda { padding: 10px 18px; color: var(--apoio); font-size: 13px; border-bottom: 1px solid var(--linha); }
  .legenda b { color: var(--texto); font-weight: 600; }
  .palco { min-height: 0; display: grid; place-items: center; padding: 14px; overflow: auto; }
  .palco iframe { width: 100%; height: 100%; border: 0; border-radius: 12px; background: #fff; box-shadow: 0 30px 60px -30px rgba(0,0,0,.7); }
  .palco.celular iframe { width: 390px; height: min(844px, 100%); border-radius: 30px; box-shadow: 0 0 0 10px #000, 0 30px 60px -20px rgba(0,0,0,.8); }
  .palco.lado { grid-template-columns: 1fr 1fr; gap: 14px; place-items: stretch; }
  .palco.lado figure { min-width: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 8px; }
  .palco.lado figcaption { font: 600 12px/1 "Geist", sans-serif; color: var(--apoio); }
  .palco.lado.celular { place-items: center; }
  .palco.lado.celular figure { height: 100%; justify-items: center; }

  @media (max-width: 900px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto auto minmax(0, 1fr); }
    nav { display: flex; gap: 6px; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--linha); padding: 8px 10px; }
    nav h2 { display: none; } nav button { width: auto; white-space: nowrap; } nav button small { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1>ArvisX CRM — proposta de design novo
    <small>As mesmas telas, o mesmo conteúdo e cada coisa no mesmo lugar. Só a roupa muda.</small>
  </h1>
  <div class="grupo-botoes" role="group" aria-label="Versão" id="versoes">
    <button type="button" data-versao="atual">Hoje</button>
    <button type="button" data-versao="a"><span class="amostra" style="background:#0f131a"></span>Opção A · Marinho e ouro</button>
    <button type="button" data-versao="b"><span class="amostra" style="background:#0f3b33"></span>Opção B · Verde-garrafa e ouro</button>
  </div>
  <div class="grupo-botoes" role="group" aria-label="Comparar" id="comparar">
    <button type="button" data-lado="nao">Uma tela</button>
    <button type="button" data-lado="sim">Lado a lado com hoje</button>
  </div>
  <div class="grupo-botoes" role="group" aria-label="Aparelho" id="aparelhos">
    <button type="button" data-aparelho="desktop">Computador</button>
    <button type="button" data-aparelho="celular">Celular</button>
  </div>
</header>
<nav aria-label="Telas" id="lista"></nav>
<main>
  <p class="legenda" id="legenda"></p>
  <div class="palco" id="palco"></div>
</main>
<script>
(async function () {
  const telas = await (await fetch("telas.json")).json();
  const NOMES = { atual: "Hoje", a: "Opção A · Marinho e ouro", b: "Opção B · Verde-garrafa e ouro" };
  const SOBRE = {
    atual: "o desenho que está no ar: menu escuro colado na borda, ouro nos botões.",
    a: "a paleta de hoje com os papéis trocados: o marinho vira a ação, o ouro fica só como sinal (IA, ativo, atenção).",
    b: "paleta nova: verde-garrafa profundo sobre uma tela sálvia, com o ouro do logo como sinal.",
  };
  const q = new URLSearchParams(location.hash.slice(1));
  const estado = { tela: q.get("tela") || telas[0].id, versao: q.get("versao") || "a", aparelho: q.get("aparelho") || "desktop", lado: q.get("lado") || "nao" };
  const caminho = (versao, id) => (versao === "atual" ? `../telas/${id}.html` : `${versao}/${id}.html`);

  const lista = document.getElementById("lista");
  const grupo = (titulo, itens) => `<h2>${titulo}</h2>` + itens.map((t) => `<button type="button" data-tela="${t.id}">${t.titulo}<small>${t.grupo}</small></button>`).join("");
  lista.innerHTML = grupo("Principais telas", telas.filter((t) => t.principal >= 0)) + grupo("Demais telas", telas.filter((t) => t.principal < 0));

  function desenhar() {
    const tela = telas.find((t) => t.id === estado.tela) || telas[0];
    const lado = estado.lado === "sim" && estado.versao !== "atual";
    const palco = document.getElementById("palco");
    palco.className = `palco ${estado.aparelho}${lado ? " lado" : ""}`;
    const quadro = (versao) => `<iframe title="${tela.titulo} — ${NOMES[versao]}" src="${caminho(versao, tela.id)}"></iframe>`;
    palco.innerHTML = lado
      ? `<figure><figcaption>${NOMES.atual}</figcaption>${quadro("atual")}</figure><figure><figcaption>${NOMES[estado.versao]}</figcaption>${quadro(estado.versao)}</figure>`
      : quadro(estado.versao);
    document.getElementById("legenda").innerHTML = `<b>${tela.titulo}</b> · <b>${NOMES[estado.versao]}</b>: ${SOBRE[estado.versao]}`;
    document.querySelectorAll("#lista button").forEach((b) => b.setAttribute("aria-current", String(b.dataset.tela === tela.id)));
    document.querySelectorAll("#versoes button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.versao === estado.versao)));
    document.querySelectorAll("#aparelhos button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.aparelho === estado.aparelho)));
    document.querySelectorAll("#comparar button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lado === estado.lado)));
    history.replaceState(null, "", "#" + new URLSearchParams(estado));
  }

  document.addEventListener("click", (e) => {
    const b = e.target.closest("button[data-tela], button[data-versao], button[data-aparelho], button[data-lado]");
    if (!b) return;
    Object.assign(estado, b.dataset.tela ? { tela: b.dataset.tela } : b.dataset.versao ? { versao: b.dataset.versao } : b.dataset.aparelho ? { aparelho: b.dataset.aparelho } : { lado: b.dataset.lado });
    desenhar();
  });
  // Setas do teclado trocam de tela, para folhear rápido.
  document.addEventListener("keydown", (e) => {
    if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
    const i = telas.findIndex((t) => t.id === estado.tela);
    const proximo = telas[(i + (e.key === "ArrowDown" ? 1 : -1) + telas.length) % telas.length];
    estado.tela = proximo.id;
    desenhar();
    e.preventDefault();
  });
  desenhar();
})();
</script>
</body>
</html>
