<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onboarding · antes e depois</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="../tokens.css">
<style>
  /* ------------------------------ visor ------------------------------ */
  html, body { margin: 0; }
  body { background: var(--painel-3); color: var(--texto); font: 500 14px/1.5 var(--sans); min-height: 100vh; }
  button { font: inherit; cursor: pointer; }
  .v-topo { position: sticky; top: 0; z-index: 50; background: var(--navy); color: var(--inverso); padding: 12px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
  .v-topo h1 { font: 650 17px/1.1 var(--display); font-stretch: 112%; letter-spacing: -.02em; margin: 0; color: #fff; }
  .v-topo h1 em { font-style: normal; color: var(--ouro); }
  .v-grupo { display: flex; align-items: center; gap: 8px; }
  .v-grupo > span { font: 500 10.5px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: #8b95a6; }
  .seg { display: inline-flex; background: var(--navy-3); border: 1px solid var(--navy-linha); border-radius: 999px; padding: 3px; }
  .seg button { border: 0; background: transparent; color: #b9c1ce; padding: 6px 12px; border-radius: 999px; font-weight: 700; font-size: 12.5px; white-space: nowrap; }
  .seg button[aria-pressed="true"] { background: var(--ouro); color: var(--navy); }
  .v-trilha { display: flex; gap: 6px; overflow-x: auto; padding: 12px 20px 0; }
  .v-trilha button { border: 1px solid var(--linha-forte); background: var(--painel); color: var(--apoio); border-radius: 999px; padding: 7px 13px; font-weight: 700; font-size: 12.5px; white-space: nowrap; display: inline-flex; align-items: center; gap: 7px; }
  .v-trilha button .n { font: 600 10.5px/1 var(--mono); color: var(--fraco); }
  .v-trilha button[aria-current="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }
  .v-trilha button[aria-current="true"] .n { color: var(--ouro); }
  .v-trilha .sep { width: 1px; background: var(--linha-forte); margin: 4px 4px; flex: none; }
  .v-plano { padding: 10px 20px 0; font-size: 12.5px; color: var(--apoio); }
  .v-plano b { color: var(--navy); }
  .palco { display: grid; gap: 16px; padding: 14px 20px 8px; grid-template-columns: minmax(0, 1fr); }
  .palco.lado { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .palco.celular { justify-content: center; grid-template-columns: minmax(0, 390px); }
  .palco.celular.lado { grid-template-columns: minmax(0, 390px) minmax(0, 390px); }
  .q-rot { display: flex; align-items: center; gap: 8px; font: 600 11px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--apoio); margin-bottom: 8px; }
  .q-rot .bola { width: 8px; height: 8px; border-radius: 50%; background: var(--fraco); }
  .q-rot.depois { color: var(--ouro-escuro); } .q-rot.depois .bola { background: var(--ouro); }
  .quadro { border: 1px solid var(--linha-forte); border-radius: var(--r-lg); background: var(--fundo); overflow: hidden; box-shadow: var(--sombra); }
  .quadro-in { container-type: inline-size; background: var(--fundo); }
  .v-notas { margin: 6px 20px 40px; background: var(--painel); border: 1px solid var(--linha); border-radius: var(--r-lg); padding: 16px 20px; }
  .v-notas h2 { font: 650 15px/1.2 var(--display); font-stretch: 110%; margin: 0 0 8px; color: var(--navy); }
  .v-notas ul { margin: 0; padding-left: 18px; color: var(--apoio); }
  .v-notas li { margin: 3px 0; } .v-notas li b { color: var(--texto); }
  .sim { border: 1.5px dashed var(--sinal); background: var(--sinal-suave); color: #1d5fa8; border-radius: var(--r); padding: 8px 12px; font-weight: 700; font-size: 12.5px; display: inline-flex; gap: 7px; align-items: center; }
  .sim small { font: 500 10px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; opacity: .8; }

  /* ------------------------------ peças comuns ------------------------------ */
  .marca { display: flex; align-items: center; gap: 10px; }
  .marca img { height: 32px; }
  .marca .r { font: 500 10.5px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--fraco); }
  .marca strong { display: block; font: 650 16px/1.15 var(--display); font-stretch: 110%; letter-spacing: -.02em; margin-top: 3px; }
  .t2 { font: 650 26px/1.1 var(--display); font-stretch: 112%; letter-spacing: -.03em; color: var(--navy); margin: 0; }
  .sub { color: var(--apoio); margin: 6px 0 0; max-width: 62ch; }
  .cx { background: var(--painel); border: 1px solid var(--linha); border-radius: var(--r-lg); padding: 20px; }
  .cp { display: grid; gap: 6px; margin-bottom: 16px; }
  .cp label, .lb { font-weight: 700; font-size: 13px; }
  .cp input[type=text], .cp select, .cp textarea { font: 500 14px/1.4 var(--sans); padding: 9px 11px; border: 1px solid var(--linha-forte); border-radius: var(--r); background: var(--painel); color: var(--texto); width: 100%; box-sizing: border-box; }
  .cp input:focus, .cp textarea:focus, .cp select:focus { outline: 2px solid rgba(212,175,55,.55); outline-offset: 1px; border-color: var(--ouro); }
  .aj { font-size: 12px; color: var(--apoio); margin: 0; }
  .bt { border: 1px solid transparent; border-radius: var(--r); padding: 9px 16px; font-weight: 700; font-size: 13.5px; display: inline-flex; align-items: center; gap: 7px; }
  .bt.ouro { background: var(--ouro); color: var(--navy); } .bt.ouro:hover { background: var(--ouro-claro); }
  .bt.sec { background: var(--painel); border-color: var(--linha-forte); color: var(--texto); }
  .bt.fant { background: transparent; color: var(--apoio); }
  .rod { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; margin-top: 18px; }
  .rod.dir { justify-content: flex-end; }
  .termos { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; }
  .termos u { text-underline-offset: 2px; }
  .op { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--linha); border-radius: var(--r); padding: 11px 12px; background: var(--painel); text-align: left; width: 100%; box-sizing: border-box; }
  .op + .op { margin-top: 8px; }
  .op b { display: block; font-size: 13.5px; } .op span { display: block; font-size: 12px; color: var(--apoio); }
  .op .rd { width: 15px; height: 15px; border-radius: 50%; border: 2px solid var(--linha-forte); flex: none; margin-top: 2px; }
  .op.on { border-color: var(--ouro); background: var(--ouro-suave); } .op.on .rd { border-color: var(--ouro-escuro); box-shadow: inset 0 0 0 3px var(--painel); background: var(--ouro-escuro); }
  .faixa { border-radius: var(--r); padding: 10px 12px; font-size: 13px; border: 1px solid var(--linha); background: var(--painel); }
  .faixa.ok { border-color: rgba(46,139,87,.35); background: var(--ok-suave); }
  .osso { display: block; height: 8px; border-radius: 4px; background: var(--painel-3); margin: 8px 0; }
  .qr { width: 190px; height: 190px; margin: 12px auto 0; padding: 10px; background: #fff; border: 1px solid var(--linha); border-radius: var(--r); display: grid; grid-template-columns: repeat(21, 1fr); gap: 0; }
  .qr i { background: var(--navy); } .qr i.b { background: transparent; }
  .segm { display: inline-flex; border: 1px solid var(--linha-forte); border-radius: 999px; padding: 3px; background: var(--painel); }
  .segm span { padding: 5px 12px; border-radius: 999px; font-weight: 700; font-size: 12px; color: var(--apoio); }
  .segm span.on { background: var(--navy); color: #fff; }

  /* ------------------------------ ANTES (como é hoje) ------------------------------ */
  .a { max-width: 760px; margin: 0 auto; padding: 28px 24px 56px; }
  .a-topo { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .a .passos { justify-content: space-between; margin: 18px 0 26px; padding: 0; list-style: none; }
  .a .passos li + li::before { width: 14px; margin: 0 6px; }
  .a .passos li { font-size: 12px; gap: 6px; }
  .a-cab { margin-bottom: 18px; }
  .a-lista { list-style: none; padding: 0; margin: 0 auto; max-width: 340px; display: grid; gap: 8px; font-size: 13.5px; }
  .a-lista li { display: flex; align-items: center; gap: 8px; } .a-lista i { width: 8px; height: 8px; border-radius: 50%; background: #10b981; }
  .a-pecas { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; list-style: none; padding: 0; margin: 12px 0 0; }
  .a-pecas li { border: 1px solid var(--linha); border-radius: var(--r); padding: 11px; font-size: 12px; color: var(--apoio); }
  .a-pecas li b { color: var(--texto); font-size: 13.5px; } .a-pecas summary { cursor: pointer; text-decoration: underline; margin-top: 6px; } .a-pecas ol { padding-left: 18px; margin: 6px 0 0; }
  .a-col { display: flex; gap: 8px; align-items: flex-start; border: 1px solid var(--linha); border-radius: var(--r); padding: 10px; margin-bottom: 8px; }
  .a-col .n { width: 18px; text-align: center; font-size: 12px; color: var(--fraco); margin-top: 9px; }
  .a-col .c { flex: 1; min-width: 0; } .a-col input { width: 100%; box-sizing: border-box; font: 500 14px var(--sans); padding: 8px 10px; border: 1px solid var(--linha-forte); border-radius: var(--r); }
  .a-col p { margin: 4px 0 0; font-size: 12px; color: var(--apoio); } .a-col .ob { font-size: 12px; color: var(--fraco); margin-top: 9px; }
  .a-vazio { display: grid; grid-template-columns: 150px 300px 1fr; min-height: 620px; }
  .a-vazio .lat { background: var(--navy); padding: 16px 12px; } .a-vazio .lat i { display: block; height: 9px; border-radius: 5px; background: var(--navy-linha); margin: 14px 0; }
  .a-vazio .lst { border-right: 1px solid var(--linha); background: var(--painel); padding: 16px; }
  .a-vazio .meio { display: grid; place-items: center; color: var(--fraco); text-align: center; }
  .a-vazio .meio i { font-size: 44px; display: block; margin-bottom: 8px; }

  /* ------------------------------ DEPOIS (proposta) ------------------------------ */
  .w { min-height: 720px; display: flex; flex-direction: column; }
  .w-topo { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 28px; background: var(--painel); border-bottom: 1px solid var(--linha); }
  .w-prog { min-width: 220px; } .w-prog span { font: 600 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--apoio); }
  .w-prog .barra { height: 6px; border-radius: 3px; background: var(--painel-3); margin-top: 7px; overflow: hidden; }
  .w-prog .barra i { display: block; height: 100%; background: linear-gradient(90deg, var(--bronze), var(--ouro)); border-radius: 3px; transition: width .5s; }
  .w-passos { display: flex; gap: 6px; list-style: none; margin: 0; padding: 10px 28px; background: var(--painel); border-bottom: 1px solid var(--linha); overflow-x: auto; }
  .w-passos li { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 12px; color: var(--fraco); white-space: nowrap; padding: 5px 10px; border-radius: 999px; }
  .w-passos li.feito { color: var(--apoio); } .w-passos li.feito i { color: var(--ok); }
  .w-passos li.atual { background: var(--ouro-suave); color: var(--navy); box-shadow: inset 0 0 0 1px var(--ouro); }
  .w-corpo { flex: 1; display: grid; grid-template-columns: minmax(0, 460px) minmax(0, 1fr); }
  .w-corpo.um { grid-template-columns: minmax(0, 1fr); }
  .w-form { padding: 28px; }
  .w-form .t2 { font-size: 24px; } .w-form .sub { margin-bottom: 18px; }
  .w-prev { background: var(--navy); padding: 22px; display: flex; flex-direction: column; gap: 12px; position: relative; overflow: hidden; }
  .w-prev::before { content: ""; position: absolute; right: -120px; top: -120px; width: 340px; height: 340px; border-radius: 50%; border: 1px solid rgba(212,175,55,.25); }
  .w-prev-rot { font: 600 10.5px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ouro); display: flex; gap: 7px; align-items: center; }
  .w-prev-rot .pulso { width: 7px; height: 7px; border-radius: 50%; background: var(--ouro); animation: pulso 1.6s infinite; }
  @keyframes pulso { 0% { box-shadow: 0 0 0 0 rgba(212,175,55,.6); } 100% { box-shadow: 0 0 0 9px rgba(212,175,55,0); } }
  .w-prev-leg { color: #a2abb9; font-size: 12.5px; margin: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chips button { border: 1px solid var(--linha-forte); background: var(--painel); border-radius: 999px; padding: 7px 12px; font-weight: 700; font-size: 12.5px; color: var(--texto); display: inline-flex; gap: 6px; align-items: center; }
  .chips button.on { background: var(--navy); border-color: var(--navy); color: #fff; } .chips button.on i { color: var(--ouro); }

  /* mini CRM */
  .mini { background: var(--fundo); border-radius: var(--r-lg); overflow: hidden; display: grid; grid-template-columns: 132px minmax(0, 1fr); min-height: 320px; box-shadow: var(--sombra-alta); position: relative; }
  .mini-lat { background: var(--navy-2); padding: 14px 10px; color: #d8dce3; border-right: 1px solid var(--navy-linha); }
  .mini-lat .org { font: 650 12.5px/1.2 var(--display); color: #fff; padding: 0 6px 12px; border-bottom: 1px solid var(--navy-linha); margin-bottom: 8px; word-break: break-word; min-height: 16px; }
  .mini-lat .org small { display: block; font: 500 9px/1 var(--mono); letter-spacing: .1em; color: var(--ouro); margin-bottom: 5px; }
  .mini-lat .it { display: flex; gap: 7px; align-items: center; font-size: 11.5px; font-weight: 600; padding: 6px; border-radius: 6px; color: #aab2c0; }
  .mini-lat .it.on { background: var(--navy-3); color: #fff; box-shadow: inset 2px 0 0 var(--ouro); }
  .mini-lat .it.foco { box-shadow: 0 0 0 2px var(--ouro); color: #fff; animation: pulso 1.4s infinite; }
  .mini-cont { padding: 14px; min-width: 0; }
  .mini-cont h4 { font: 650 14px/1.2 var(--display); margin: 0 0 3px; color: var(--navy); } .mini-cont .s { font-size: 11px; color: var(--apoio); margin: 0 0 10px; }
  .mcols { display: flex; gap: 7px; overflow: hidden; }
  .mcol { flex: 1; min-width: 0; background: var(--painel-2); border-radius: 8px; padding: 7px; animation: entra .45s both; }
  .mcol b { display: block; font-size: 10px; line-height: 1.2; color: var(--navy); min-height: 24px; }
  .mcol .c { height: 26px; border-radius: 6px; background: var(--painel); border: 1px solid var(--linha); margin-top: 6px; }
  .mcol .c.lead { height: auto; padding: 5px 6px; font-size: 10px; font-weight: 700; border-color: var(--ouro); box-shadow: 0 0 0 2px rgba(212,175,55,.25); animation: entra .4s both; }
  .mcol.g b { color: var(--ok); } .mcol.p b { color: var(--erro); }
  @keyframes entra { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .conv { display: flex; gap: 9px; align-items: center; padding: 9px; border-radius: 8px; background: var(--painel); border: 1px solid var(--linha); margin-bottom: 7px; animation: entra .4s both; }
  .conv .av, .av { width: 30px; height: 30px; border-radius: 50%; background: var(--painel-3); display: grid; place-items: center; font: 700 11px var(--sans); color: var(--navy); flex: none; }
  .av.ia { background: var(--navy); color: var(--ouro); box-shadow: 0 0 0 2px var(--ouro); }
  .conv .tx { min-width: 0; flex: 1; } .conv b { font-size: 12.5px; display: block; } .conv span { font-size: 11.5px; color: var(--apoio); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tg { font: 600 9.5px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; padding: 4px 7px; border-radius: 999px; background: var(--painel-3); color: var(--apoio); white-space: nowrap; }
  .tg.ok { background: var(--ok-suave); color: var(--ok); } .tg.ouro { background: var(--ouro-suave); color: var(--ouro-escuro); } .tg.novo { background: var(--sinal-suave); color: #1d5fa8; }
  .vz { text-align: center; color: var(--fraco); font-size: 12px; padding: 40px 10px; border: 1.5px dashed var(--linha-forte); border-radius: var(--r); }
  .ag { background: var(--painel); border-radius: var(--r-lg); padding: 16px; display: flex; gap: 12px; align-items: center; }
  .ag .av { width: 46px; height: 46px; font-size: 16px; } .ag b { font: 650 17px/1.1 var(--display); display: block; } .ag span { font-size: 12px; color: var(--apoio); }
  .ag-regras { background: var(--navy-3); border: 1px solid var(--navy-linha); border-radius: var(--r); padding: 11px 13px; color: #d8dce3; font-size: 12.5px; }
  .ag-regras b { font: 600 10.5px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ouro); display: block; margin-bottom: 6px; }
  .ag-regras li { margin-left: 16px; }

  /* chat */
  .zap { background: #e9e4da; border-radius: var(--r-lg); overflow: hidden; display: flex; flex-direction: column; border: 1px solid var(--linha-forte); }
  .zap-topo { background: var(--navy); color: #fff; padding: 10px 14px; display: flex; gap: 10px; align-items: center; }
  .zap-topo b { font-size: 13.5px; display: block; } .zap-topo span { font-size: 11px; color: #a2abb9; }
  .zap-msgs { padding: 14px; display: flex; flex-direction: column; gap: 7px; min-height: 250px; max-height: 320px; overflow-y: auto; }
  .bal { max-width: 82%; padding: 8px 11px; border-radius: 12px; font-size: 13px; line-height: 1.4; animation: entra .3s both; box-shadow: 0 1px 1px rgba(0,0,0,.08); }
  .bal.eu { align-self: flex-end; background: #d9fdd3; border-bottom-right-radius: 3px; }
  .bal.ele { align-self: flex-start; background: #fff; border-bottom-left-radius: 3px; }
  .bal small { display: block; font: 600 9.5px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ouro-escuro); margin-bottom: 4px; }
  .dig { display: inline-flex; gap: 3px; } .dig i { width: 6px; height: 6px; border-radius: 50%; background: var(--fraco); animation: dig 1s infinite; } .dig i:nth-child(2) { animation-delay: .15s; } .dig i:nth-child(3) { animation-delay: .3s; }
  @keyframes dig { 0%, 60%, 100% { opacity: .3; transform: none; } 30% { opacity: 1; transform: translateY(-3px); } }
  .zap-sug { display: flex; gap: 6px; padding: 0 14px 10px; flex-wrap: wrap; }
  .zap-sug button { border: 1px solid var(--linha-forte); background: #fff; border-radius: 999px; padding: 5px 10px; font-size: 12px; font-weight: 600; }
  .zap-ent { display: flex; gap: 8px; padding: 10px; background: #f3f0ea; }
  .zap-ent input { flex: 1; min-width: 0; border: 1px solid var(--linha-forte); border-radius: 999px; padding: 9px 14px; font: 500 13.5px var(--sans); }
  .zap-ent button { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--ouro); color: var(--navy); font-size: 17px; display: grid; place-items: center; flex: none; }

  /* funil */
  .quadro-f { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px 12px; align-items: stretch; }
  .fcol { flex: 0 0 168px; background: var(--painel); border: 1px solid var(--linha); border-radius: var(--r); padding: 10px; display: flex; flex-direction: column; gap: 6px; min-height: 190px; animation: entra .35s both; }
  .fcol.sobre { outline: 2px dashed var(--ouro); outline-offset: 2px; }
  .fcol .cab { display: flex; gap: 4px; align-items: flex-start; }
  .fcol .pega { cursor: grab; color: var(--fraco); font-size: 15px; margin-top: 2px; }
  .fcol .nome { flex: 1; min-width: 0; font-weight: 800; font-size: 13px; outline: none; border-radius: 5px; padding: 1px 4px; cursor: text; }
  .fcol .nome:hover { background: var(--painel-2); } .fcol .nome:focus { background: var(--ouro-suave); box-shadow: 0 0 0 1.5px var(--ouro); }
  .fcol .x { border: 0; background: none; color: var(--fraco); padding: 2px; font-size: 13px; }
  .fcol .ex { font-size: 11px; color: var(--apoio); margin: 0; line-height: 1.35; }
  .fcol .ob { font: 600 9.5px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--fraco); }
  .fcol.g { border-top: 3px solid var(--ok); } .fcol.p { border-top: 3px solid var(--erro); }
  .fcard { margin-top: auto; background: var(--ouro-suave); border: 1px solid var(--ouro); border-radius: 8px; padding: 8px; font-size: 12px; cursor: grab; display: flex; gap: 7px; align-items: center; }
  .fcard b { display: block; font-size: 12.5px; } .fcard span { color: var(--apoio); font-size: 11px; }
  .fmais { flex: 0 0 120px; border: 1.5px dashed var(--linha-forte); border-radius: var(--r); background: transparent; color: var(--apoio); font-weight: 700; font-size: 12.5px; }

  /* equipe / fim / app */
  .pess { display: flex; gap: 10px; align-items: center; background: var(--painel); border-radius: var(--r); padding: 10px 12px; animation: entra .35s both; }

      ${S.cartao === i ? `<div class="fcard" draggable="true" data-arr="card"><span class="av">MC</span><div><b>Marina Costa</b><span>cartão de exemplo</span></div></div>` : ""}</div>`).join("")}
      ${S.funil.length < 8 ? `<button class="fmais" data-ac="maiscol"><i class="ph ph-plus"></i> Adicionar coluna</button>` : ""}</div>
    ${S.funil.length >= 8 ? `<p class="aj">8 colunas é o máximo — mais que isso não cabe na tela do celular.</p>` : ""}
    <div class="rod"><button class="bt fant" data-ir="prox">Pular por enquanto</button><button class="bt ouro" data-ir="prox">Usar este quadro <i class="ph ph-arrow-right"></i></button></div>`, null),
  testar: () => casca("testar", `<h2 class="t2">Veja ele atender</h2><p class="sub">Escreva como se fosse um cliente. Nada é enviado pelo WhatsApp — é só um ensaio, entre você e ele.</p>
    <div class="zap"><div class="zap-topo"><span class="av ia">${esc(ini(nomeAg()))}</span><div><b>${esc(nomeNeg())}</b><span>${esc(nomeAg())} · ensaio</span></div></div>
      <div class="zap-msgs" id="msgs">${S.chat.length ? "" : `<div class="vz" style="background:rgba(255,255,255,.5)">Escolha uma pergunta abaixo ou escreva a sua.</div>`}${S.chat.map(m => `<div class="bal ${m.de}">${m.de === "ele" ? `<small>${esc(nomeAg())}</small>` : ""}${esc(m.tx)}</div>`).join("")}${S.digitando ? `<div class="bal ele"><span class="dig"><i></i><i></i><i></i></span></div>` : ""}</div>
      <div class="zap-sug">${SUG.map((s, i) => `<button data-sug="${i}">${s}</button>`).join("")}</div>
      <div class="zap-ent"><input id="f-chat" type="text" placeholder="Escreva como se fosse um cliente" maxlength="4000"><button data-ac="enviar" aria-label="Mandar mensagem"><i class="ph-fill ph-paper-plane-right"></i></button></div></div>
    <p class="aj" style="margin-top:8px">Esta conversa não foi enviada a ninguém e não aparece no seu inbox.</p>
    <div class="rod"><button class="bt fant" data-ir="prox">Pular</button><button class="bt ${S.chat.length > 1 ? "ouro" : "sec"}" data-ir="prox">Continuar <i class="ph ph-arrow-right"></i></button></div>`, PREV.testar(), LEG.testar()),
  equipe: () => casca("equipe", `<h2 class="t2">${ia() ? "Quem trabalha com ele" : "Sua equipe"}</h2><p class="sub">${ia() ? "Seu funcionário não trabalha sozinho: quando ele passar uma conversa adiante, é uma dessas pessoas que atende." : "Quem vai atender as conversas com você."}</p>
    <div class="cp"><label for="f-em">E-mail de quem vai atender com você</label><textarea id="f-em" rows="4" data-m="emails" placeholder="alice@empresa.com&#10;bob@empresa.com">${esc(S.emails)}</textarea></div>
    <div class="cp"><label for="f-pp">O que essas pessoas podem fazer</label><select id="f-pp" data-m="papel">${["Somente leitura", "Atendente", "Gerente", "Administrador"].map(p => `<option ${S.papel === p ? "selected" : ""}>${p}</option>`).join("")}</select></div>
    <div class="rod"><button class="bt fant" data-ir="prox">Pular por enquanto</button><button class="bt ouro" data-ir="prox">Enviar convites <i class="ph ph-arrow-right"></i></button></div>`, PREV.equipe(), LEG.equipe()),
  fim: () => { const n = (ia() ? TOUR_IA : TOUR_SEM).length; return `<div class="w"><header class="w-topo">${marca()}<div class="w-prog"><span>Concluído</span><div class="barra"><i style="width:100%"></i></div></div></header><div class="fim">
    <div class="selo"><i class="ph-fill ph-check"></i></div><h2 class="t2">Tudo pronto!</h2><p class="sub" style="margin:8px auto 0">${ia() ? "Seu funcionário está montado. Daqui em diante é só acompanhar." : "Sua empresa está pronta: conecte, atenda e acompanhe tudo pelo Inbox."}</p>${ia() ? "" : `<p class="aj" style="margin-top:6px"><u>Agentes de IA estão nos planos Standard e Premium.</u></p>`}
    <ul>${doPlano().filter(p => !p.extra).map((p, i) => { const pul = p.id === "whatsapp" && !S.conectado; return `<li class="${pul ? "pul" : ""}" style="animation-delay:${i * 110}ms"><i class="${pul ? "ph ph-minus-circle" : "ph-fill ph-check-circle"}"></i>${rot(p)}${pul ? "<small>você pulou</small>" : ""}</li>`; }).join("")}</ul>
    <div class="prox"><i class="ph ph-compass"></i><div><b>O que vem agora</b>${n} primeiros passos dentro do CRM, com a tela certa acesa a cada um. Você faz no seu ritmo.</div></div>
    <button class="bt ouro" data-ir="prox" style="padding:12px 22px">Começar a usar <i class="ph ph-arrow-right"></i></button></div></div>`; },
  app: () => { const tour = ia() ? TOUR_IA : TOUR_SEM, vistos = tour.filter((_, i) => S.vistos[S.plano + i]).length, t = S.tour >= 0 ? tour[S.tour] : null;
    return `<div class="app">${lateral("Inbox", t ? t.menu : null)}<div class="app-cont"><h2 class="t2" style="font-size:22px">Inbox</h2><p class="sub" style="margin-bottom:14px">Conversas de exemplo, para o inbox não nascer vazio. Somem quando a primeira conversa real chegar.</p>
      ${[["MC", "Marina Costa", "Oi, vocês atendem sábado?"], ["BT", "Bruno Tavares", "Quanto custa a avaliação?"], ["HM", "Helena Marques", "Consigo remarcar para quinta?"]].map(c => `<div class="conv"><span class="av">${c[0]}</span><div class="tx"><b>${c[1]}</b><span>${c[2]}</span></div><span class="tg ouro">exemplo</span></div>`).join("")}</div>
      ${t ? `<div class="coach"><small>${t.menu} · no menu ao lado</small><b>${t.como}</b><p>${t.pq}</p><ol>${t.passos.map(x => `<li>${x}</li>`).join("")}</ol><button class="bt ouro" data-ac="entendi">Entendi <i class="ph ph-check"></i></button></div>` : ""}
      <div class="pp"><div class="pp-cab"><span>${vistos}/${tour.length}</span><b>Primeiros passos</b><div class="barra"><i style="width:${vistos / tour.length * 100}%"></i></div></div>
        <ul>${tour.map((x, i) => `<li class="${S.vistos[S.plano + i] ? "feito" : ""} ${S.tour === i ? "on" : ""}"><button data-tour="${i}"><i class="${S.vistos[S.plano + i] ? "ph-fill ph-check-circle" : "ph ph-circle"}"></i>${x.como}</button></li>`).join("")}</ul>
        ${vistos === tour.length ? `<p class="aj" style="padding:0 14px 12px">Tudo visto. O painel se recolhe e fica guardado no Guia de uso.</p>` : ""}</div></div>`; },
};

/* ============================== montagem ============================== */
const $ = s => document.querySelector(s);
function render() {
  if (!doPlano().some(p => p.id === S.passo)) S.passo = "welcome";
  document.querySelectorAll("#segPlano button").forEach(b => b.setAttribute("aria-pressed", b.dataset.plano === S.plano));
  document.querySelectorAll("#segVista button").forEach(b => b.setAttribute("aria-pressed", b.dataset.vista === S.vista));
  document.querySelectorAll("#segTela button").forEach(b => b.setAttribute("aria-pressed", b.dataset.tela === S.tela));
  $("#vPlano").innerHTML = ia() ? "<b>Teste, Standard e Premium</b> têm IA e seguem o mesmo roteiro: 6 passos, falando do \"funcionário\"." : "<b>Essencial</b> não tem IA: 4 passos (sem \"Treinar\" e sem \"Ver ele atender\"), falando da empresa e da equipe.";
  let n = 0;
  $("#trilha").innerHTML = doPlano().map(p => `${p.id === "fim" ? `<span class="sep"></span>` : ""}<button data-passo="${p.id}" aria-current="${p.id === S.passo}"><span class="n">${p.extra ? "+" : ++n}</span>${rot(p)}</button>`).join("");
  const q = (lado, html) => `<div><div class="q-rot ${lado}"><span class="bola"></span>${lado === "antes" ? "Antes · como é hoje" : "Depois · proposta"}</div><div class="quadro"><div class="quadro-in" data-lado="${lado}">${html}</div></div></div>`;
  const palco = $("#palco");
  palco.className = "palco" + (S.vista === "lado" ? " lado" : "") + (S.tela === "celular" ? " celular" : "");
  palco.innerHTML = (S.vista !== "depois" ? q("antes", ANTES[S.passo]()) : "") + (S.vista !== "antes" ? q("depois", DEPOIS[S.passo]()) : "");
  $("#notas").innerHTML = `<h2>O que muda em "${rot(PASSOS.find(p => p.id === S.passo))}"</h2><ul>${NOTAS[S.passo].map(x => `<li>${x}</li>`).join("")}</ul>`;
  escala();
  const m = $("#msgs"); if (m) m.scrollTop = m.scrollHeight;
}
function escala() {
  const W = S.tela === "celular" ? 390 : 1180;
  document.querySelectorAll(".quadro").forEach(qd => { const el = qd.firstElementChild; el.style.zoom = 1; el.style.width = "auto"; const larg = S.tela === "celular" ? W : Math.max(W, qd.clientWidth); el.style.width = larg + "px"; el.style.zoom = Math.min(1, qd.clientWidth / larg); });
}
function prev() { const el = document.querySelector('[data-lado="depois"] [data-prev]'); if (el && PREV[S.passo]) { el.innerHTML = PREV[S.passo](); const l = document.querySelector('[data-lado="depois"] [data-leg]'); if (l) l.textContent = LEG[S.passo](); } document.querySelectorAll(".marca strong").forEach(x => x.textContent = nomeNeg()); }
function ir(d) { const l = doPlano(), i = l.findIndex(p => p.id === S.passo); S.passo = l[Math.min(l.length - 1, Math.max(0, i + d))].id; render(); window.scrollTo({ top: 0 }); }
function responde(tx) {
  if (!tx.trim() || S.digitando) return;
  S.chat.push({ de: "eu", tx }); S.digitando = true; if (S.etapaDoEnsaio < 0) S.etapaDoEnsaio = 0; render();
  const t = tx.toLowerCase(), r = RESP[S.tom], k = /marc|agend|hor[áa]rio/.test(t) ? "marcar" : /s[áa]bado|domingo|fim de semana/.test(t) ? "sab" : /pre[çc]o|valor|custa|quanto/.test(t) ? "preco" : "outro";
  setTimeout(() => { S.digitando = false; S.chat.push({ de: "ele", tx: r[k](nomeNeg()) }); S.etapaDoEnsaio = Math.min(S.funil.length - 1, k === "marcar" ? 3 : Math.max(S.etapaDoEnsaio, k === "outro" ? 1 : 2)); render(); const f = $("#f-chat"); if (f) f.focus(); }, 1300);
}

document.addEventListener("click", e => {
  const b = e.target.closest("button, [data-passo]"); if (!b) return; const d = b.dataset;
  if (d.plano) { S.plano = d.plano; S.tour = -1; }
  else if (d.vista) S.vista = d.vista;
  else if (d.tela) S.tela = d.tela;
  else if (d.passo) S.passo = d.passo;
  else if (d.ir) return ir(1);
  else if (d.ramo) { S.ramo = d.ramo; carregaPacote(d.ramo); }
  else if (d.modelo) { S.ramo = d.modelo; carregaPacote(d.modelo); }
  else if (d.forma) S.forma = d.forma;
  else if (d.tom) S.tom = +d.tom;
  else if (d.sug) return responde(SUG[+d.sug]);
  else if (d.tira) { S.funil.splice(+d.tira, 1); if (S.cartao >= S.funil.length) S.cartao = 0; }
  else if (d.tour) S.tour = +d.tour;
  else if (d.ac === "conectar") S.conectado = true;
  else if (d.ac === "oi") S.oi = true;
  else if (d.ac === "enviar") { const f = $("#f-chat"); return responde(f.value); }
  else if (d.ac === "maiscol") S.funil.splice(S.funil.length - 2, 0, { nome: "Nova coluna", passo: null });
  else if (d.ac === "entendi") { const tour = ia() ? TOUR_IA : TOUR_SEM; S.vistos[S.plano + S.tour] = true; const prox = tour.findIndex((_, i) => !S.vistos[S.plano + i]); S.tour = prox; }
  else return;
  render();
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.m) { S[t.dataset.m] = t.value; prev(); }
  else if (t.dataset.nomecol) S.funil[+t.dataset.nomecol].nome = t.textContent;
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.id === "f-chat") responde(e.target.value);
  if (e.key === "Enter" && e.target.dataset.nomecol) { e.preventDefault(); e.target.blur(); }
});
/* arrastar: coluna (ordem) e cartão de exemplo (entre colunas) */
let arr = null;
document.addEventListener("dragstart", e => { const a = e.target.closest("[data-arr]"); if (!a) return; arr = { tipo: a.dataset.arr, i: +a.dataset.i }; e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", "x"); });
document.addEventListener("dragover", e => { const c = e.target.closest(".fcol"); if (!c || !arr) return; e.preventDefault(); document.querySelectorAll(".fcol.sobre").forEach(x => x.classList.remove("sobre")); c.classList.add("sobre"); });
document.addEventListener("drop", e => { const c = e.target.closest(".fcol"); if (!c || !arr) return; e.preventDefault(); const para = +c.dataset.col;
  if (arr.tipo === "card") S.cartao = para; else if (arr.i !== para) { const [m] = S.funil.splice(arr.i, 1); S.funil.splice(para, 0, m); }
  arr = null; render(); });
document.addEventListener("dragend", () => { arr = null; document.querySelectorAll(".fcol.sobre").forEach(x => x.classList.remove("sobre")); });
addEventListener("resize", escala);
/* endereço com estado, para abrir direto numa tela: #passo=funil&vista=lado&plano=sem&tela=celular */
new URLSearchParams(location.hash.slice(1)).forEach((v, k) => { if (["passo", "vista", "plano", "tela"].includes(k)) S[k] = v; });
render();
</script>
</body>
</html>
