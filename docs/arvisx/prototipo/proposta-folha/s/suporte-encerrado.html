  .faixa-suporte span { min-width: 0; }
  .faixa-suporte .btn { flex: none; }
  .fim { max-width: 576px; margin: 0 auto; padding: 32px; }
  .fim h1 { font-family: var(--display); font-stretch: 112%; font-weight: 600; letter-spacing: -.03em; font-size: 18px; line-height: 1.2; color: var(--navy); }

<main>
  <div class="faixa-suporte" role="alert">
    <span>Acompanhamento encerrado <strong>Clínica Vitalis</strong></span>
    <button type="button" class="btn secundario p">Sair do acompanhamento</button>
  </div>
  <div class="fim">
    <h1>Encerre o acompanhamento para continuar</h1>
    <p>O prazo ou as permissões desta sessão mudaram. Saia do acompanhamento para voltar à sua organização.</p>
