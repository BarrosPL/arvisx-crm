<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acesso revogado</title>
<meta name="grupo" content="Entrada">
<meta name="ordem" content="410">
<meta name="rota" content="/acesso-revogado">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="../base-suave.css">
<style>
  main.centro { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 32px 16px; }
  .centro .cartao { width: 100%; max-width: 448px; }
  .centro .cartao > .corpo { padding: 32px; }
  .centro .meio { text-align: center; }
  .centro h1 { font-family: var(--display); font-stretch: 112%; font-weight: 600; letter-spacing: -.03em; font-size: 24px; line-height: 1.15; color: var(--navy); }
  .centro h1.menor { font-size: 18px; }
  .centro .texto-c { color: var(--apoio); margin-top: 8px; }
  .centro .acoes-c { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 24px; }
  .centro .simbolo { width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 18px; background: var(--painel); border: 1px solid var(--linha); display: grid; place-items: center; box-shadow: var(--sombra); }
  .centro .simbolo img { height: 36px; width: auto; }
  .centro .fio { width: 96px; margin: 16px auto; }
  .centro .pilha { display: flex; flex-direction: column; align-items: stretch; gap: 12px; margin-top: 16px; }
  .centro .sub-link { text-align: center; text-decoration: underline; text-underline-offset: 4px; }
  @media (max-width: 860px) { .centro .cartao > .corpo { padding: 24px 20px; } }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400..700&family=Newsreader:opsz,wght@6..72,400..600&display=swap">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/light/style.css">
<link rel="stylesheet" href="../folha.css">
<link rel="stylesheet" href="../paleta-b.css">
<link rel="stylesheet" href="../suave.css">
</head>
<body data-rota="/acesso-revogado" data-raiz="../..">
<main class="centro">
  <div class="cartao"><div class="corpo meio">
    <div class="simbolo"><img src="../../marca/arvisx-simbolo-oficial.png" alt=""></div>
    <h1>Acesso revogado</h1>
    <div class="fio centro" aria-hidden="true"></div>
    <p class="texto-c" style="margin-top:0">Seu acesso a esta organização foi retirado. Se você acredita que isso é um engano, fale com quem administra a empresa — só ela pode devolvê-lo.</p>
    <div class="aviso-faixa aviso" style="margin:16px 0;text-align:left"><span>Recebeu um convite novo? Abra o link que chegou no seu e-mail — ele funciona mesmo com esta tela aberta, e devolve o seu acesso.</span></div>
    <button type="submit" class="btn primario bloco">Sair</button>
  </div></div>
</main>
<script src="../folha.js"></script>
</body>
</html>
