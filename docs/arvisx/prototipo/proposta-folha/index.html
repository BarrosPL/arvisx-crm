<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ArvisX CRM — novo design (Folha)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400..700&display=swap">
<style>
  :root { --tela: #14191b; --painel: #1c2325; --linha: #2b3437; --texto: #eceff0; --apoio: #9aa7aa; --fraco: #6c7a7d; --marca: #d4af37; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font: 14px/1.45 "Hanken Grotesk", "Segoe UI", Arial, sans-serif; background: var(--tela); color: var(--texto); display: grid; grid-template-columns: 288px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  button, input { font: inherit; color: inherit; }
  button { background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--marca); outline-offset: 2px; border-radius: 8px; }
  a { color: inherit; }

  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 12px 18px; border-bottom: 1px solid var(--linha); }
  header h1 { font-size: 16px; font-weight: 600; letter-spacing: -.02em; margin-right: auto; }
  header h1 small { display: block; margin-top: 4px; font-weight: 400; font-size: 12px; letter-spacing: 0; color: var(--apoio); }
  .grupo-botoes { display: inline-flex; padding: 3px; gap: 2px; border-radius: 9px; background: var(--painel); }
  .grupo-botoes button { height: 32px; padding: 0 12px; border-radius: 7px; font-weight: 500; font-size: 13px; color: var(--apoio); white-space: nowrap; }
  .grupo-botoes button:hover { color: var(--texto); }
  .grupo-botoes button[aria-pressed="true"] { background: var(--texto); color: #101416; font-weight: 600; }

  aside { min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); border-right: 1px solid var(--linha); }
  .filtro { padding: 12px 12px 8px; }
  .filtro input { width: 100%; height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--linha); background: var(--painel); font-size: 13px; }
  .filtro input::placeholder { color: var(--fraco); }
  .filtro p { margin-top: 8px; font-size: 12px; color: var(--fraco); }
  nav { overflow-y: auto; padding: 0 10px 24px; scrollbar-width: thin; scrollbar-color: var(--linha) transparent; }
  nav h2 { position: sticky; top: 0; padding: 12px 10px 6px; font-size: 12px; font-weight: 500; color: var(--fraco); background: var(--tela); }
  nav button { display: block; width: 100%; padding: 6px 10px; border-radius: 7px; text-align: left; font-size: 13px; color: var(--apoio); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  nav button:hover { background: var(--painel); color: var(--texto); }
  nav button[aria-current="true"] { background: var(--painel); color: var(--texto); font-weight: 600; }

  main { min-width: 0; min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); }
  .legenda { padding: 10px 18px; color: var(--apoio); font-size: 13px; border-bottom: 1px solid var(--linha); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .legenda b { color: var(--texto); font-weight: 600; }
  .legenda code { font-size: 12px; color: var(--fraco); margin-left: 8px; }
  .palco { min-height: 0; display: grid; place-items: center; padding: 14px; overflow: auto; }
  .palco iframe { width: 100%; height: 100%; border: 0; border-radius: 10px; background: #fff; }
  .palco.celular iframe { width: 390px; height: min(844px, 100%); border-radius: 28px; box-shadow: 0 0 0 10px #000; }
  .palco.lado { grid-template-columns: 1fr 1fr; gap: 14px; place-items: stretch; }
  .palco.lado figure { min-width: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 8px; }
  .palco.lado figcaption { font-size: 12px; font-weight: 500; color: var(--apoio); }
  .palco.lado.celular { place-items: center; }
  .palco.lado.celular figure { height: 100%; justify-items: center; }

  @media (max-width: 900px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto auto minmax(0, 1fr); }
    aside { border-right: 0; border-bottom: 1px solid var(--linha); grid-template-rows: auto auto; }
    nav { display: flex; gap: 6px; overflow-x: auto; padding: 0 10px 10px; }
    nav h2 { display: none; } nav button { width: auto; overflow: visible; }
    .filtro p { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1>ArvisX CRM — novo design
    <small>Todas as telas do sistema, menos a landing page. Mesmo conteúdo e cada coisa no mesmo lugar. <a href="varredura.html" target="_blank">Ver a varredura de UI</a></small>
  </h1>
  <div class="grupo-botoes" role="group" aria-label="Versão" id="versoes">
    <button type="button" data-versao="s">Suave</button>
    <button type="button" data-versao="b">Folha</button>
    <button type="button" data-versao="comparar">Folha × Suave</button>
    <button type="button" data-versao="atual">Hoje</button>
    <button type="button" data-versao="lado">Lado a lado</button>
  </div>
  <div class="grupo-botoes" role="group" aria-label="Aparelho" id="aparelhos">
    <button type="button" data-aparelho="desktop">Computador</button>
    <button type="button" data-aparelho="celular">Celular</button>
  </div>
</header>
<aside>
  <div class="filtro">
    <input type="search" id="busca" placeholder="Procurar tela…" aria-label="Procurar tela">
    <p id="conta"></p>
  </div>
  <nav aria-label="Telas" id="lista"></nav>
</aside>
<main>
  <p class="legenda" id="legenda"></p>
  <div class="palco" id="palco"></div>
</main>
<script>
(async function () {
  const telas = await (await fetch("telas.json", { cache: "no-store" })).json();
  const q = new URLSearchParams(location.hash.slice(1));
  const estado = { tela: q.get("tela") || "inbox", versao: q.get("versao") || "s", aparelho: q.get("aparelho") || "desktop" };
  if (!telas.some((t) => t.id === estado.tela)) estado.tela = telas[0].id;
  const caminho = (versao, id) => (versao === "atual" ? `../telas/${id}.html` : `${versao === "s" ? "s" : "b"}/${id}.html`);
  const lista = document.getElementById("lista");
  let visiveis = telas;

  function montarLista(filtro) {
    const f = filtro.trim().toLowerCase();
    visiveis = f ? telas.filter((t) => (t.titulo + " " + t.grupo + " " + t.rota + " " + t.id).toLowerCase().includes(f)) : telas;
    const grupos = [...new Set(visiveis.map((t) => t.grupo))];
    lista.innerHTML = grupos.map((g) => `<h2>${g} · ${visiveis.filter((t) => t.grupo === g).length}</h2>` + visiveis.filter((t) => t.grupo === g).map((t) => `<button type="button" data-tela="${t.id}" title="${t.rota}">${t.titulo}</button>`).join("")).join("");
    document.getElementById("conta").textContent = f ? `${visiveis.length} de ${telas.length} telas` : `${telas.length} telas · setas ↑ ↓ para folhear`;
    marcar();
  }
  function marcar() {
    document.querySelectorAll("#lista button").forEach((b) => b.setAttribute("aria-current", String(b.dataset.tela === estado.tela)));
    document.querySelectorAll("#versoes button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.versao === estado.versao)));
    document.querySelectorAll("#aparelhos button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.aparelho === estado.aparelho)));
  }
  function desenhar() {
    const tela = telas.find((t) => t.id === estado.tela) || telas[0];
    const comparar = estado.versao === "comparar";
    const lado = estado.versao === "lado" || comparar;
    const NOMES = { s: "Suave", b: "Folha", atual: "Hoje" };
    const palco = document.getElementById("palco");
    palco.className = `palco ${estado.aparelho}${lado ? " lado" : ""}`;
    const quadro = (versao, nome) => `<iframe title="${tela.titulo} — ${nome}" src="${caminho(versao, tela.id)}"></iframe>`;
    palco.innerHTML = lado
      ? [comparar ? "b" : "atual", "s"].map((v) => `<figure><figcaption>${NOMES[v]}</figcaption>${quadro(v, NOMES[v])}</figure>`).join("")
      : quadro(estado.versao, NOMES[estado.versao]);
    document.getElementById("legenda").innerHTML = `<b>${tela.titulo}</b> · ${tela.grupo}<code>${tela.rota}</code>`;
    marcar();
    document.querySelector('#lista button[aria-current="true"]')?.scrollIntoView({ block: "nearest" });
    history.replaceState(null, "", "#" + new URLSearchParams(estado));
  }

  document.addEventListener("click", (e) => {
    const b = e.target.closest("button[data-tela], button[data-versao], button[data-aparelho]");
    if (!b) return;
    Object.assign(estado, b.dataset.tela ? { tela: b.dataset.tela } : b.dataset.versao ? { versao: b.dataset.versao } : { aparelho: b.dataset.aparelho });
    desenhar();
  });
  document.getElementById("busca").addEventListener("input", (e) => montarLista(e.target.value));
  document.addEventListener("keydown", (e) => {
    if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
    const i = visiveis.findIndex((t) => t.id === estado.tela);
    estado.tela = visiveis[(i + (e.key === "ArrowDown" ? 1 : -1) + visiveis.length) % visiveis.length].id;
    desenhar();
    e.preventDefault();
  });
  montarLista("");
  desenhar();
})();
</script>
</body>
</html>
