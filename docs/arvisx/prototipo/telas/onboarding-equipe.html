<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quem trabalha com ele</title>
<meta name="grupo" content="Entrada">
<meta name="ordem" content="440">
<meta name="rota" content="/onboarding/invite-team">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="../tokens.css">
<style>
  .onb { max-width: 760px; margin: 0 auto; padding: 32px 24px 64px; }
  .onb-topo { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
  .onb-topo .lockup img { height: 36px; } .onb-topo .lockup b { font-size: 20px; }
  .onb-topo .org { text-align: right; }
  .onb-topo .org .rotulo { margin-bottom: 3px; }
  .onb-topo .org strong { font-family: var(--display); font-stretch: 110%; font-weight: 650; letter-spacing: -.02em; font-size: 16px; }
  .onb .passos { justify-content: space-between; margin: 20px 0 28px; }
  .onb-cab { margin-bottom: 20px; }
  .onb-cab h2 { font-family: var(--display); font-stretch: 112%; font-weight: 650; letter-spacing: -.03em; font-size: 26px; line-height: 1.1; color: var(--navy); }
  .onb-cab p { color: var(--apoio); margin-top: 6px; max-width: 64ch; }
  .onb .cartao + .cartao { margin-top: 16px; }
  .rodape-nav { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; margin-top: 20px; }
  @media (max-width: 860px) {
    .onb { padding: 20px 16px 48px; }
    .onb-topo img { height: 28px; }
    .onb .passos li + li::before { width: 12px; margin: 0 4px; }
    .onb .passos li { gap: 6px; }
    .rodape-nav .btn { flex: 1; }
  }
</style>
</head>
<body data-rota="/onboarding/invite-team">
<div class="onb">
  <header class="onb-topo">
    <span class="lockup g escuro" aria-label="ARVISX CRM"><img src="../marca/arvisx-simbolo.png" alt=""><b>ARVISX<em>CRM</em></b></span>
    <div class="org"><span class="rotulo">ARVISX CRM</span><strong>Clínica Vitalis</strong></div>
  </header>
  <div class="fio" style="margin:0"></div>
  <ol class="passos" aria-label="Passos">
    <li class="feito"><span class="n">1</span><span class="t">Seu negócio</span></li>
    <li class="feito"><span class="n">2</span><span class="t">O telefone dele</span></li>
    <li class="feito"><span class="n">3</span><span class="t">Treinar</span></li>
    <li class="feito"><span class="n">4</span><span class="t">Onde ele organiza</span></li>
    <li class="feito"><span class="n">5</span><span class="t">Ver ele atender</span></li>
    <li class="atual"><span class="n">6</span><span class="t">Quem trabalha com ele</span></li>
  </ol>

  <main>
    <header class="onb-cab">
      <h2>Quem trabalha com ele</h2>
      <p>Seu funcionário não trabalha sozinho: quando ele passar uma conversa adiante, é uma dessas pessoas que atende.</p>
    </header>

    <section class="cartao"><div class="corpo form">
      <div class="campo">
        <label for="emails">E-mail de quem vai trabalhar com ele</label>
        <textarea id="emails" rows="6" placeholder="alice@empresa.com&#10;bob@empresa.com">marcos.lima@clinicavitalis.com.br
renata.borges@clinicavitalis.com.br</textarea>
      </div>
      <div class="campo">
        <label for="role">O que essas pessoas podem fazer</label>
        <select id="role"><option>Somente leitura</option><option selected>Atendente</option><option>Gerente</option><option>Administrador</option></select>
      </div>
      <div class="rodape-nav" style="margin-top:4px">
        <button type="button" class="btn fantasma">Pular por enquanto</button>
        <button type="button" class="btn primario">Enviar convites</button>
      </div>
    </div></section>
  </main>
</div>
</body>
</html>
