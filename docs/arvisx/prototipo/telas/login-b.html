<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login · opção B (produto na tela)</title>
<meta name="grupo" content="Entrada">
<meta name="ordem" content="12">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../login-opcoes.css">
</head>
<body data-rota="/login">
<div class="publico">
  <section class="lado painel-b">
    <img class="logo-topo" src="../marca/arvisx-crm-oficial-escuro.png" alt="ARVISX CRM">
    <div class="texto">
      <p class="etiqueta">O CRM DA ARVISX</p>
      <h1>O WhatsApp chega.<br>A <em>IA</em> atende e vende.</h1>
      <p>Agentes de IA que atendem, qualificam e vendem no WhatsApp, dentro do CRM da sua empresa.</p>
      <div class="fio"></div>
    </div>
    <div class="vitrine">
      <div class="moldura"><img src="../marca/login-inbox.png" alt="Inbox do ARVISX CRM"></div>
      <div class="flutuante">
        <div class="quem"><span class="avatar ia">LA</span>Lia — AgendaPlus · IA</div>
        Atendemos até as 20h. Posso reservar quinta às 18h30 para a sua avaliação?
      </div>
    </div>
  </section>
  <section class="formulario">
    <div>
      <div class="icone-app"><img src="../marca/arvisx-simbolo-oficial.png" alt=""></div>
      <h2>Entrar</h2>
      <form class="form" novalidate>
        <div class="campo"><label for="email">Email</label><input id="email" type="email" autocomplete="email"></div>
        <div class="campo"><label for="senha">Senha</label><div style="position:relative"><input id="senha" type="password" style="padding-right:44px"><button type="button" aria-label="Mostrar senha" class="olho"><i class="ph ph-eye"></i></button></div></div>
        <button type="submit" class="btn primario g bloco">Entrar</button>
      </form>
      <p class="rodape-form"><a href="#">Esqueci minha senha</a></p>
    </div>
  </section>
</div>
</body>
</html>
