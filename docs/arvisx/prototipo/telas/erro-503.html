<style>
  main.centro { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 32px 16px; }
  .centro .cartao { width: 100%; max-width: 448px; }
  .centro .cartao > .corpo { padding: 32px; }
  .centro .meio { text-align: center; }
  .centro h1 { font-family: var(--display); font-stretch: 112%; font-weight: 650; letter-spacing: -.03em; font-size: 24px; line-height: 1.15; color: var(--navy); }
  .centro h1.menor { font-size: 20px; }
  .centro .texto-c { color: var(--apoio); margin-top: 8px; }
  .centro .acoes-c { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 24px; }
  .centro .simbolo { width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 16px; background: var(--painel); border: 1px solid var(--linha); display: grid; place-items: center; box-shadow: var(--sombra); }
  .centro .simbolo img { height: 36px; width: auto; }
  .centro .fio { width: 96px; margin: 16px auto; }
  .centro .pilha { display: flex; flex-direction: column; align-items: stretch; gap: 12px; margin-top: 16px; }
  .centro .sub-link { text-align: center; text-decoration: underline; text-underline-offset: 4px; }
  @media (max-width: 860px) { .centro .cartao > .corpo { padding: 24px 20px; } }
</style>

<body data-rota="/503">
<main class="centro">
  <div class="cartao"><div class="corpo meio">

    <p class="texto-c">Voltamos em alguns minutos.</p>
    <div class="acoes-c">

    </div>
  </div></div>
</main>
