# ArvisX CRM no Easypanel (servico `crm`). Baseado no docker-compose.prod.yml do upstream, sem Caddy
# (o Traefik do Easypanel faz o HTTPS), sem voz/telefonia. Imagens do fork (ghcr.io/barrospl, tag main;
# a producao fixa por digest no .env). O default nunca aponta para o upstream (ghcr.io/melgarafael).
# Requer o servico `supabase-crm` no ar (cria a rede arvisx-crm-net). Variaveis vem do .env do Easypanel.
x-logging: &log
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

services:
  # Aplica o schema (baseline.sql), semeia as chaves de cifra e cria o primeiro admin. Idempotente; termina e sai.
  init:
    image: postgres:17-alpine
    restart: "no"
    mem_limit: 384m
    environment:
      SUPABASE_DB_URL: ${SUPABASE_DB_URL}
      SUPABASE_INTERNAL_URL: http://arvisx-supabase-gw:8000
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      OWNER_EMAIL: ${OWNER_EMAIL}
      OWNER_PASSWORD: ${OWNER_PASSWORD}
      # Semeadas em private.app_secrets so se a linha ainda nao existir (init.sh, semear_chave).
      NUVEMSHOP_OAUTH_ENCRYPTION_KEY: ${NUVEMSHOP_OAUTH_ENCRYPTION_KEY:-}
      CPF_ENCRYPTION_KEY: ${CPF_ENCRYPTION_KEY:-}
    volumes:
      - ../../../supabase/baseline.sql:/baseline.sql:ro
      - ../../../supabase/migrations:/migrations:ro
      - ./migracoes-pos-baseline.txt:/migracoes-pos-baseline.txt:ro
      - crm-backups:/backup
      - ./init.sh:/init.sh:ro
    command: ["sh", "/init.sh"]
    logging: *log
    networks: [crm]

  crm-app:
    image: ${APP_IMAGE:-ghcr.io/barrospl/deskcommcrm:main}
    pull_policy: ${APP_PULL_POLICY:-always}
    restart: unless-stopped
    mem_limit: 768m
    env_file: .env
    environment:
      SUPABASE_DB_ADMIN_URL: ""
      EVENT_LOG_WORKER_DRAINS: "true"
      # Onboarding guiado dentro do CRM (lib/onboarding/guia.ts). `off` no .env volta ao wizard.
      ONBOARDING_GUIADO: ${ONBOARDING_GUIADO:-on}
    depends_on:
      init: {condition: service_completed_successfully}
      srh: {condition: service_started}
      waha: {condition: service_started}
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(3000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    logging: *log
    # `easypanel`: o Traefik chega ao app por ela. `crm`: alcanca o banco/gateway do Supabase.
    # `app` so na rede interna (scheduler e WAHA chamam http://app:3000); na `easypanel` (compartilhada) o nome do
    # servico vira DNS, por isso o servico se chama crm-app.
    networks:
      internal: {aliases: [app]}
      crm: {}
      easypanel: {}

  worker:
    image: ${WORKER_IMAGE:-ghcr.io/barrospl/deskcomm-worker:main}
    pull_policy: ${WORKER_PULL_POLICY:-always}
    restart: unless-stopped
    mem_limit: 512m
    stop_grace_period: 40s
    env_file: .env
    environment:
      WAHA_API_BASE_URL: http://waha:3000
      SUPABASE_DB_ADMIN_URL: ""
    depends_on:
      init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *log
    networks: [internal, crm]

  waha:
    image: ${WAHA_IMAGE:-devlikeapro/waha:latest-2026.7.2}
    restart: unless-stopped
    mem_limit: 1280m
    environment:
      WAHA_API_KEY: "sha512:${WAHA_API_KEY_SHA512}"
      WHATSAPP_HOOK_URL: http://app:3000/api/v1/webhooks/waha
      WHATSAPP_HOOK_EVENTS: "message.any,message.ack,message.edited,message.revoked,message.reaction,session.status,state.change"
      WHATSAPP_HOOK_HMAC_KEY: ${WAHA_HMAC_SECRET}
      WHATSAPP_DEFAULT_ENGINE: ${WAHA_DEFAULT_ENGINE:-NOWEB}
      WAHA_DASHBOARD_ENABLED: "false"
      WHATSAPP_RESTART_ALL_SESSIONS: "True"
    volumes:
      - waha-data:/app/.sessions
      - waha-media:/app/.media
    logging: *log
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 128m
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging: *log
    networks: [internal]

  srh:
    image: hiett/serverless-redis-http@sha256:5b0bb9239fce53abf87b2018a7a0deb9ec7bd900c5360738fe5fbeeb426f9150
    restart: unless-stopped
    mem_limit: 128m
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${SRH_TOKEN}
      SRH_CONNECTION_STRING: "redis://redis:6379"
    depends_on:
      redis: {condition: service_healthy}
    logging: *log
    networks: [internal]

  scheduler:
    image: ${SCHEDULER_IMAGE:-ghcr.io/barrospl/deskcomm-scheduler:main}
    pull_policy: ${SCHEDULER_PULL_POLICY:-always}
    restart: unless-stopped
    mem_limit: 64m
    depends_on:
      crm-app: {condition: service_healthy}
    environment:
      TZ: UTC
      INTERNAL_SECRET: ${INTERNAL_SECRET}
    logging: *log
    networks: [internal]

  # Chamada de voz do WhatsApp (WaCalls) — DESLIGADA POR PADRAO, nos moldes do docker-compose.prod.yml do upstream.
  # Liga com `COMPOSE_PROFILES=voz` no .env deste servico; sem isso o compose nem cria o conteiner.
  # Vincula um SEGUNDO APARELHO ao numero que atende (caminho nao oficial: risco de bloqueio da CONTA).
  # Regras que valem aqui (tests/unit/portas-do-compose.test.ts, mesma logica):
  #   - `crm-app` e `worker` NAO ganham `depends_on: wacalls` (profile inativo derrubaria o CRM inteiro);
  #   - a API HTTP do WaCalls fica so na rede `internal` (nada de TCP publicado);
  #   - a unica porta publicada e UDP, igual no host e no conteiner (o numero entra no candidato SDP do navegador);
  #   - imagem do upstream fixada por digest, nunca republicada (docs/doctrine/packaging.md); `missing` porque digest e imutavel.
  wacalls:
    profiles: ["voz"]
    image: ${WACALLS_IMAGE:-ghcr.io/jotadev66/wacalls@sha256:9ff52ef9455cf42125a911c38bb8c855f0cc205516cada2054e5c05546909022}
    pull_policy: ${WACALLS_PULL_POLICY:-missing}
    restart: unless-stopped
    mem_limit: 256m
    environment:
      # O servico NAO sobe sem usuario e senha de admin (exigencia do upstream).
      WACALLS_ADMIN_USER: ${WACALLS_ADMIN_USER:-}
      WACALLS_ADMIN_PASSWORD: ${WACALLS_ADMIN_PASSWORD:-}
      # Bearer que o app e o worker usam; o MESMO valor vai em WACALLS_API_TOKEN do .env deles.
      WACALLS_API_TOKEN: ${WACALLS_API_TOKEN:-}
      WACALLS_CORS_ORIGINS: ${WACALLS_CORS_ORIGINS:-}
      WACALLS_TRUSTED_PROXIES: ${WACALLS_TRUSTED_PROXIES:-}
      # IP PUBLICO da VPS, anunciado como candidato ICE; sem ele a ligacao conecta e fica muda.
      WACALLS_PUBLIC_IP: ${WACALLS_PUBLIC_IP:-}
      # Porta UDP fixa do audio (sem ela o upstream usa portas efemeras impossiveis de publicar).
      WACALLS_WEBRTC_UDP_PORT: ${WACALLS_WEBRTC_UDP_PORT:-7881}
    ports:
      - "${WACALLS_WEBRTC_UDP_PORT:-7881}:${WACALLS_WEBRTC_UDP_PORT:-7881}/udp"
    volumes:
      # wacalls.db guarda a sessao do WhatsApp; apagar o volume desvincula os aparelhos.
      - wacalls-data:/data
    logging: *log
    networks: [internal]

volumes:
  crm-backups:
  waha-data:
  waha-media:
  wacalls-data:

networks:
  internal: {}
  crm:
    external: true
    name: arvisx-crm-net
  easypanel:
    external: true
